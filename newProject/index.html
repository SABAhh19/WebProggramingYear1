<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="nav">
      <div class="logo-group">
        <h4 class="shop">SHOP.</h4>
        <h5 class="MStore">MINIMAL STORE</h5>
      </div>

      <div class="nav-links">
        <h5 class="home">Home</h5>
        <h5 class="NShop">Shop</h5>
        <h5 class="about">About</h5>
        <h5 class="Contact">Contact</h5>
      </div>

      <div class="nav-actions">
        <button class="glass">🔍</button>
        <button class="cart">🛒</button>
      </div>
    </div>
    <div class="main-container">
      <div class="half1">
        <h4>NEW COLLECTION</h4>
        <h1>Everyday essentials, thoughtfully designed.</h1>
        <p>A simple, clean layout for your future e-commerce store.
          Products are static for now, but the design is ready
          for real data later.
        </p>
        <div class="button-group">
          <button>Browse products</button>
          <button style="background-color: transparent; color: #333; border: 1px solid #ccc;">Learn more</button>
        </div>
      </div>
      <div class="half2">
        <div class="product-card">
          <div class="image-area">
            <span class="featured-badge">FEATURED</span>
          </div>
          <div class="product-info">
            <h6 class="product-name">Linen Overshirt</h6>
            <div class="product-footer">
              <p class="price">$79.00</p>
              <p class="meta">In stock &middot; Free shipping</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
</html>
